name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows ${{ matrix.arch }} ${{ matrix.kind }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   platform: x64,   dir: x86-64-mustdie, kind: release }
          - { arch: x86,   platform: Win32, dir: x86-mustdie,    kind: release }
          - { arch: arm64, platform: ARM64, dir: arm64-mustdie,  kind: release }
          - { arch: x64,   platform: x64,   dir: x86-64-mustdie, kind: test }
          - { arch: x86,   platform: Win32, dir: x86-mustdie,    kind: test }
          - { arch: arm64, platform: ARM64, dir: arm64-mustdie,  kind: test }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.platform }} -DMEBET_BUILD_KIND=${{ matrix.kind }} -DMEBET_JAVA_HOME="$env:JAVA_HOME_21_X64"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: "Check the wrapper imports (ТЗ §4, KnownDLLs only)"
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Recurse -Filter dumpbin.exe "$vs\VC\Tools\MSVC" | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents build\src\windows\Release\MebetGuard.exe | Out-String
          Write-Output $deps
          $static = ($deps -split 'Image has the following delay load dependencies:')[0]
          $names = [regex]::Matches($static, '(?im)^\s+(\S+\.dll)\s*$') | ForEach-Object { $_.Groups[1].Value.ToLower() }
          $bad = $names | Where-Object { $_ -notin @('kernel32.dll', 'ntdll.dll') }
          if ($bad) { throw "wrapper imports more than kernel32: $($bad -join ', ')" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\${{ matrix.dir }}, dist\symbols | Out-Null
          Copy-Item build\src\windows\Release\MebetGuard.exe, build\src\windows\Release\MebetGuard.dll dist\${{ matrix.dir }}\
          Copy-Item build\src\windows\Release\*.pdb dist\symbols\
          Get-FileHash dist\${{ matrix.dir }}\* -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 200

      - name: Java for the smoke test (Liberica, signed by BellSoft like the client Java)
        if: matrix.kind == 'test' && matrix.arch == 'x64'
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "25"
          architecture: x64

      # GitHub's Windows images boot with test signing on. The dev-mode check closes the
      # client in every build (ТЗ §8, not switchable), so on these runners the smoke test
      # proves that check; the JVM path runs on Linux/macOS here and on the Windows stand.
      - name: Smoke test — the JVM starts through the guard (or dev mode is caught)
        id: smoke
        if: matrix.kind == 'test' && matrix.arch == 'x64'
        shell: pwsh
        env:
          MEBET_TEST_NO_UI: "1"
        run: |
          New-Item -ItemType Directory -Force tests\out | Out-Null
          & "$env:JAVA_HOME\bin\javac.exe" -d tests\out tests\java\MebetSmoke.java
          Copy-Item tests\out\MebetSmoke.class dist\
          $p = Start-Process -FilePath dist\${{ matrix.dir }}\MebetGuard.exe -ArgumentList '-XX:+DisableAttachMechanism', '-Dmebet.reports=false', '-Dmebet.errors=false', '-cp', 'tests\out', 'MebetSmoke' -NoNewWindow -PassThru -Wait -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          Get-Content smoke.out, smoke.err
          if ($p.ExitCode -eq 203 -and (Select-String -Path smoke.err -Pattern 'testsigning' -Quiet)) {
            Write-Output '::notice::runner boots with test signing: dev-mode check closed the client (203) as required'
            "devmode=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if (-not (Select-String -Path smoke.out -Pattern 'mebet-smoke-ok' -Quiet)) { throw 'smoke marker missing' }

      - name: Smoke test — an unlisted DLL closes the client (210)
        if: matrix.kind == 'test' && matrix.arch == 'x64' && steps.smoke.outputs.devmode != 'true'
        shell: pwsh
        env:
          MEBET_TEST_NO_UI: "1"
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /LD tests\native\unlisted.c /Fe:tests\out\unlisted.dll"
          $dll = (Resolve-Path tests\out\unlisted.dll).Path
          $p = Start-Process -FilePath dist\${{ matrix.dir }}\MebetGuard.exe -ArgumentList '-Dmebet.reports=false', '-Dmebet.errors=false', '-cp', 'tests\out', 'MebetSmoke', 'load', "`"$dll`"" -NoNewWindow -PassThru -Wait -RedirectStandardOutput unlisted.out -RedirectStandardError unlisted.err
          Get-Content unlisted.out, unlisted.err
          if ($p.ExitCode -ne 210) { throw "expected exit code 210 (untrusted_module), got $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mebet-windows-${{ matrix.arch }}-${{ matrix.kind }}
          path: dist/

  linux:
    name: linux ${{ matrix.arch }} ${{ matrix.kind }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # glibc 2.28 (AlmaLinux 8): Ubuntu 18.10+, Debian 10+, RHEL 8+, Steam Deck.
    container: quay.io/pypa/manylinux_2_28_${{ matrix.machine }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: ubuntu-24.04,     machine: x86_64,  dir: x86-64-linux, kind: release }
          - { arch: arm64, runner: ubuntu-24.04-arm, machine: aarch64, dir: arm64-linux,  kind: release }
          - { arch: x64,   runner: ubuntu-24.04,     machine: x86_64,  dir: x86-64-linux, kind: test }
          - { arch: arm64, runner: ubuntu-24.04-arm, machine: aarch64, dir: arm64-linux,  kind: test }
    steps:
      - name: Tools
        run: |
          dnf install -y java-17-openjdk-devel git
          /opt/python/cp312-cp312/bin/python -m pip install --no-cache-dir cmake==3.31.6
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMEBET_BUILD_KIND=${{ matrix.kind }} -DMEBET_JAVA_HOME="$JAVA_HOME"                 -DPython3_EXECUTABLE=/opt/python/cp312-cp312/bin/python
          cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p dist/${{ matrix.dir }}
          cp build/src/posix/MebetGuard build/src/posix/libMebetGuard.so dist/${{ matrix.dir }}/
          sha256sum dist/${{ matrix.dir }}/*

      - name: Smoke test — the JVM starts through the guard
        if: matrix.kind == 'test'
        run: |
          export JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          mkdir -p tests/out
          "$JAVA_HOME/bin/javac" -d tests/out tests/java/MebetSmoke.java
          dist/${{ matrix.dir }}/MebetGuard -XX:+DisableAttachMechanism -Dmebet.reports=false -cp tests/out MebetSmoke | tee smoke.out
          grep -q mebet-smoke-ok smoke.out

      # Each start-time layer attacked with and without the guard: without it the attack must
      # work, through the guard it must be blocked (tests/e2e). The novm test build has no VM
      # detection, so it runs inside this container. In-memory injection layers are Windows-only
      # for now and run on the stand.
      - name: "e2e — атаки по слоям с гвардом и без"
        if: matrix.kind == 'test'
        run: |
          export JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          /opt/python/cp312-cp312/bin/python tests/e2e/run.py \
            --guard dist/${{ matrix.dir }}/MebetGuard --java "$JAVA_HOME" \
            --only env_hardening,jvm_agents --json e2e-${{ matrix.arch }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: mebet-linux-${{ matrix.arch }}-${{ matrix.kind }}
          path: dist/

  macos:
    name: macos universal ${{ matrix.kind }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [release, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "25"

      - name: Build (arm64 + x86_64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMEBET_BUILD_KIND=${{ matrix.kind }} -DMEBET_JAVA_HOME="$JAVA_HOME" \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --parallel

      - name: Package
        run: |
          for d in arm64-macosx x86-64-macosx; do
            mkdir -p dist/$d
            cp build/src/posix/MebetGuard build/src/posix/libMebetGuard.dylib dist/$d/
          done
          shasum -a 256 dist/*/*

      - name: Smoke test — the JVM starts through the guard
        if: matrix.kind == 'test'
        run: |
          mkdir -p tests/out
          "$JAVA_HOME/bin/javac" -d tests/out tests/java/MebetSmoke.java
          dist/arm64-macosx/MebetGuard -XX:+DisableAttachMechanism -Dmebet.reports=false -cp tests/out MebetSmoke | tee smoke.out
          grep -q mebet-smoke-ok smoke.out

      - name: "e2e — атаки по слоям с гвардом и без"
        if: matrix.kind == 'test'
        run: |
          python3 tests/e2e/run.py \
            --guard dist/arm64-macosx/MebetGuard --java "$JAVA_HOME" \
            --only env_hardening,jvm_agents --json e2e-macos.json

      - uses: actions/upload-artifact@v4
        with:
          name: mebet-macos-${{ matrix.kind }}
          path: dist/
