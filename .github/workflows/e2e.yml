#
# One Actions job per attack/defence type. The guard is built once, then each scenario from
# tests/e2e (harness.SCENARIOS) runs as its own job named after the layer, so the checks list
# reads cleanly: "e2e / jvm_agents_javaagent", "e2e / env_hardening_jto", ... Each job runs the
# attack with the guard and without it: without the guard it must work, with the guard it must
# be blocked (pytest goes red otherwise).
name: e2e

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-guard:
    name: build guard (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the novm test guard
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMEBET_BUILD_KIND=test -DMEBET_JAVA_HOME="$JAVA_HOME"
          cmake --build build --parallel
          mkdir -p out
          cp build/src/posix/MebetGuard build/src/posix/libMebetGuard.so out/
      - uses: actions/upload-artifact@v4
        with:
          name: guard-linux
          path: out/

  layer:
    needs: build-guard
    # The job name is the attack/defence type, so every scenario is its own check.
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - env_hardening_jto      # защита: чистка окружения; атака: агент через JAVA_TOOL_OPTIONS
          - env_hardening_jdk      # защита: чистка окружения; атака: агент через JDK_JAVA_OPTIONS
          - jvm_agents_javaagent   # защита: запрет чужого агента; атака: -javaagent
          - jvm_agents_agentpath   # защита: запрет чужого агента; атака: -agentpath (нативный)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@v4
        with:
          name: guard-linux
          path: out
      - name: Prepare
        run: |
          chmod +x out/MebetGuard
          sudo apt-get update && sudo apt-get install -y python3-pytest
      - name: "attack ${{ matrix.scenario }} with the guard and without it"
        run: |
          python3 -m pytest tests/e2e -v --no-header -k '${{ matrix.scenario }}' \
            --guard "$PWD/out/MebetGuard" --java "$JAVA_HOME"
